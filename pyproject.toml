[project]
name = "self-grow-agent"
version = "0.1.0"
description = "A hot-reloadable Python agent that can grow API handlers through an LLM."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
